name: Test-Workflow

on:
  workflow_dispatch:
  push: #test
    branches: [main]

jobs:
  deploy_dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev  # no approval required

    steps:
        - name: Say hello
          run: echo "✅ GitHub Actions is working on dev!"

        - name: Show date and time
          run: date

        - name: Show environment
          run: |
            echo "Runner OS: ${{ runner.os }}"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref }}"
            echo "Triggered by: ${{ github.actor }}"
            
        
        - uses: actions/checkout@v4
  
        - run: npm install
  
        - run: node script.js
  
        - name: Upload results
          uses: actions/upload-artifact@v4
          with:
            name: output
            path: report.json

  deploy_qa:
    name: Deploy to qa
    runs-on: ubuntu-latest
    environment: qa
    needs: deploy_dev

    steps:
        - name: Say hello
          run: echo "✅ GitHub Actions is working on qa!"

        - name: Show date and time
          run: date

        - name: Show environment
          run: |
            echo "Runner OS: ${{ runner.os }}"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref }}"
            echo "Triggered by: ${{ github.actor }}"


  deploy_stage:
    name: Deploy to stage
    runs-on: ubuntu-latest
    environment: stage
    needs: deploy_qa

    steps:
        - name: Say hello
          run: echo "✅ GitHub Actions is working on stage!"

        - name: Show date and time
          run: date

        - name: Show environment
          run: |
            echo "Runner OS: ${{ runner.os }}"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref }}"
            echo "Triggered by: ${{ github.actor }}"

  deploy_prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    environment: prod
    needs: deploy_stage
    permissions:
      contents: write

    steps:
        - name: Notify deployment starting
          uses: actions/github-script@v7
          with:
            script: |
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'deployment_starting',
                client_payload: {
                  application_name: 'holden-test',
                  stack_name: 'stack-holden-test',
                  environment: 'Production',
                  notification_destination: 'holden.ita-as@cambridge.org',
                  status: 'in_progress',
                  actor: context.actor,
                  run_id: context.runId.toString()
                }
              });

        - name: Say hello
          run: echo "✅ GitHub Actions is working!"

        - name: Show date and time
          run: date

        - name: Show environment
          run: |
            echo "Runner OS: ${{ runner.os }}"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref }}"
            echo "Triggered by: ${{ github.actor }}"
            
