name: Test-Workflow

on:
  workflow_dispatch:
  push: #test
    branches: [main]

jobs:
  deploy_dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev  # no approval required

    steps:
        - name: Say hello
          run: echo "✅ GitHub Actions is working on dev!"

        - name: Show date and time
          run: date

        - name: Show environment
          run: |
            echo "Runner OS: ${{ runner.os }}"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref }}"
            echo "Triggered by: ${{ github.actor }}"
        - name: Wait 60 Seconds
          uses: GuillaumeFalourd/wait-sleep-action@v1
          with:
            time: '60'

  deploy_qa:
    name: Deploy to qa
    runs-on: ubuntu-latest
    environment: qa
    needs: deploy_dev

    steps:
        - name: Say hello
          run: echo "✅ GitHub Actions is working on qa!"

        - name: Show date and time
          run: date

        - name: Show environment
          run: |
            echo "Runner OS: ${{ runner.os }}"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref }}"
            echo "Triggered by: ${{ github.actor }}"

        - name: Wait 60 Seconds
          uses: GuillaumeFalourd/wait-sleep-action@v1
          with:
            time: '60'

  deploy_stage:
    name: Deploy to stage
    runs-on: ubuntu-latest
    environment: stage
    needs: deploy_qa

    steps:
        - name: Say hello
          run: echo "✅ GitHub Actions is working on stage!"

        - name: Show date and time
          run: date

        - name: Show environment
          run: |
            echo "Runner OS: ${{ runner.os }}"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref }}"
            echo "Triggered by: ${{ github.actor }}"
        - name: Wait 60 Seconds
          uses: GuillaumeFalourd/wait-sleep-action@v1
          with:
            time: '60'

  deploy_prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    environment: prod
    needs: deploy_stage

    steps:
        - name: Say hello
          run: echo "✅ GitHub Actions is working!"

        - name: Show date and time
          run: date

        - name: Show environment
          run: |
            echo "Runner OS: ${{ runner.os }}"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref }}"
            echo "Triggered by: ${{ github.actor }}"
            
  broadcast_status:
      name: Broadcast Status
      needs: deploy_prod
      uses: ./.github/workflows/test-prod-trigger.yaml
      if: ${{ always() && needs.deploy_prod.result != 'skipped' && needs.deploy_prod.result != 'cancelled' }}
      with:
        APPLICATION_NAME: holden-test
        STACK_NAME: stack-holden-test
        ENVIRONMENT: Production
        NOTIFICATION_DESTINATION: holden.ita-as@cambridge.org
        STATUS: ${{ needs.deploy_prod.result }}
      secrets: inherit
